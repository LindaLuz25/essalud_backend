server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/miconsulta_db?useSSL=false&serverTimezone=America/Lima&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Pool dimensionado para picos de solicitudes simultáneas
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=3000

# el esquema lo gobierna el script SQL (01_schema.sql)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=30
spring.jpa.open-in-view=false

# Forzado explícitamente: si Hibernate autodetecta MariaDBDialect en vez
# de MySQLDialect, genera "FOR UPDATE OF <alias>" en los @Lock(PESSIMISTIC_WRITE)
# (usados en HorarioMedicoRepository/ListaEsperaRepository para evitar doble
# reserva), sintaxis que el propio servidor MariaDB rechaza (error 1064).
# MySQLDialect genera "FOR UPDATE" simple, compatible con MariaDB real.
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

logging.level.org.hibernate.SQL=debug


# En producción, mover a variable de entorno (nunca versionar el secreto real).
# Debe tener al menos 32 caracteres para el algoritmo HS256.
jwt.secret=18a103ed-ad29-4c43-9124-7aae0e444898
jwt.expiration-ms=86400000

# RN-04: plazo mínimo de anticipación (en horas) para cancelar o
# reprogramar una cita. Ajustar según la política institucional real.
citas.plazo-cancelacion-horas=24

# RN nueva (extensión RF-05/HU-05): días de anticipación desde los que se
# habilita confirmar una cita (no tiene sentido confirmar el mismo día
# que se agenda, si la cita es recién dentro de 2-4 meses).
citas.dias-anticipacion-confirmacion=7

